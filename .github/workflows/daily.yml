{
  "name": "daily",
  "on": {"schedule": [{"cron": "30 23 * * *"}], "workflow_dispatch": {}},
  "permissions": {"contents": "write"},
  "jobs": {"run": {"runs-on": "ubuntu-latest", "steps": [
    {"uses": "actions/checkout@v4"},
    {"uses": "actions/setup-python@v5", "with": {"python-version": "3.12"}},
    {"run": "pip install -r requirements.txt"},
    {"run": "python -m pytest -q"},
    {"run": "python -m pipeline.run_daily", "env": {"POKEMONTCG_API_KEY": "${{ secrets.POKEMONTCG_API_KEY }}"}},
    {"run": "git config user.name epq-bot; git config user.email epq-bot@users.noreply.github.com; git add -A docs; git add -A data 2>/dev/null || true; git add -A data_dev 2>/dev/null || true; git commit -m daily-update || echo nothing-new; git push"}
  ]}}
}
